<!DOCTYPE html>
<html>
<head><title>Gestión de Tareas</title></head>
<body>
    <h1>Gestión de Tareas</h1>
    <input id="titulo" placeholder="Título">
    <input id="descripcion" placeholder="Descripción">
    <button onclick="crearTarea()">Crear Tarea</button>
    <button onclick="cargarTareas()">Cargar Tareas</button>
    <div id="resultado"></div>
    <script>
    const API_URL = "http://127.0.0.1:8000/tareas";
    async function crearTarea() {
        const titulo = document.getElementById("titulo").value;
        const descripcion = document.getElementById("descripcion").value;
        const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ titulo, descripcion })
        });
        const data = await res.json();
        document.getElementById("resultado").innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
        document.getElementById("titulo").value = "";
        document.getElementById("descripcion").value = "";
        cargarTareas();
    }
    async function cargarTareas() {
        const res = await fetch(API_URL);
        const data = await res.json();
        document.getElementById("resultado").innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
    }
    </script>
</body>
</html>
